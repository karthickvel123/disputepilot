[project]
name = "disputepilot"
version = "0.1.0"
description = "DisputePilot helps Razorpay merchants respond to payment disputes (chargebacks)"
readme = "CONTEXT.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0,<3.0",
    "httpx",
    "pyyaml",
    "pytest",
    "ruff",
    "jinja2>=3.1.6",
    "google-genai>=2.30.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
