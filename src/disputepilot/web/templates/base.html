<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DisputePilot{% endblock %} - Razorpay Chargeback Defense</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span>DisputePilot</span>
      <span class="brand-badge">Defense Console</span>
    </a>
    <nav>
      <a href="/" class="active">Worklist</a>
      <a href="/webhook/razorpay/health" target="_blank">Webhook Status</a>
    </nav>
  </header>

  <main class="container">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-info">{{ success }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
