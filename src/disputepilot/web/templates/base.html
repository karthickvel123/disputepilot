<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DisputePilot{% endblock %} - Razorpay Chargeback Defense</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span>DisputePilot</span>
      <span class="brand-badge">Defense Console</span>
    </a>
    <nav>
      <a href="/">Worklist</a>
      <a href="/webhook/razorpay/health" target="_blank">Webhook Status</a>
      {% if reviewer_name %}
      <span class="text-muted" style="font-size: 0.85rem; margin-left: 0.75rem;">Reviewer: <strong>{{ reviewer_name }}</strong></span>
      <a href="/logout" style="margin-left: 0.5rem; font-size: 0.85rem;">Logout</a>
      {% else %}
      <a href="/login" style="margin-left: 0.5rem; font-size: 0.85rem;">Login</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-info">{{ success }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
