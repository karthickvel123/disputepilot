services:
  - type: web
    name: disputepilot-backend
    runtime: docker
    # Persistent disks are not available on Render free web services. This paid
    # instance is required to retain SQLite databases and uploaded evidence.
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    disk:
      name: disputepilot-data
      mountPath: /var/data/disputepilot
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_MODE
        value: sim
      - key: DATA_DIR
        value: /var/data/disputepilot
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-blue-nine-19.vercel.app,https://disputepilot-frontend.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: SESSION_SECRET
        generateValue: true
      - key: DISPUTEPILOT_ALLOW_DEV_USERS
        value: "false"
      - key: REQUIRE_INDEPENDENT_APPROVAL
        value: "true"
      - key: REVIEWER_USER
        value: ops_reviewer
      - key: REVIEWER_PASSWORD_HASH
        value: b820263f23d20f92040e9b3fb04d7c7b:7adc7ad6337a3e264b3b329ecb6136e3770a9ac6aa07e739d22ba3a022cdd99e36cea884a2b1731d3f31469b0c8b2e2693311be160cf89fa35373953c82e0832

